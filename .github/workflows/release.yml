name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Backyard -c Release -r ${{ matrix.rid }} -o publish

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/backyard.exe, LICENSE -DestinationPath backyard-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: cp LICENSE publish/ && tar -czf backyard-${{ matrix.rid }}.tar.gz -C publish backyard LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: backyard-${{ matrix.rid }}
          path: backyard-${{ matrix.rid }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*             --repo "${{ github.repository }}"             --generate-notes             --notes "Supported: Windows x64, Linux x64, macOS Apple Silicon (arm64). macOS Intel (x64) is not provided."
