name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Check tag matches csproj Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          csproj=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Backyard/Backyard.csproj)
          if [ "v$csproj" != "${{ github.ref_name }}" ]; then
            echo "csproj Version $csproj != tag ${{ github.ref_name }}"
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Backyard -c Release -r ${{ matrix.rid }} -o publish

      - name: Pack RID tool package
        shell: bash
        run: dotnet pack src/Backyard -c Release -r ${{ matrix.rid }} -p:Version=${VERSION#v} -o nupkg
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/backyard.exe, LICENSE -DestinationPath backyard-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: cp LICENSE publish/ && tar -czf backyard-${{ matrix.rid }}.tar.gz -C publish backyard LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: backyard-${{ matrix.rid }}
          path: |
            backyard-${{ matrix.rid }}.*
            nupkg/*.nupkg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pack root tool package
        run: dotnet pack src/Backyard -c Release -p:Version=${VERSION#v} -o dist/nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet (RID packages first, root last)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in dist/nupkg/backyard-farm.win-*.nupkg dist/nupkg/backyard-farm.linux-*.nupkg dist/nupkg/backyard-farm.osx-*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push "dist/nupkg/backyard-farm.${VERSION#v}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/backyard-*.zip dist/backyard-*.tar.gz             --repo "${{ github.repository }}"             --generate-notes             --notes "Supported: Windows x64, Linux x64, macOS Apple Silicon (arm64). macOS Intel (x64) is not provided."
